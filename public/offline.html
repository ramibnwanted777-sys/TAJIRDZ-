<!doctype html>
<html lang="ar-DZ" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ما كاينش اتصال — TajirDz</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: #000;
        font-family: "Tajawal", system-ui, -apple-system, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 380px;
      }
      .mark {
        display: block;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #555;
        margin: 0 0 20px;
      }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 8px;
        background: #006233;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- The real mark, inlined so the offline screen never waits on the
           network for it. Generated by `bun run icons`. -->
      <svg class="mark" viewBox="0 0 48 48" width="56" height="56" role="img"
           aria-label="TajirDz" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="12" fill="#006233" />
        <rect x="11" y="11" width="26" height="8" rx="1.5" fill="#ffffff" />
        <rect x="20.5" y="19" width="7" height="9" rx="1.5" fill="#ffffff" />
        <polygon points="16.5,26.5 31.5,26.5 24,39" fill="#ffffff" />
      </svg>
      <h1>ما كاينش اتصال</h1>
      <p>
        راك بلا اتصال. المنتجات اللي كنت تشوفهم يقدرو يبقاو متاحين، بصح خاصك
        ترجع للاتصال باش تشوف الجديد.
      </p>
      <button onclick="location.reload()">عاود جرب</button>
    </div>
  </body>
</html>
